version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    ignore:
      - dependency-name: typescript
        versions: [">= 7"]
    cooldown:
      default-days: 7
      semver-minor-days: 7
      semver-major-days: 14
    groups:
      svelte:
        patterns: ["svelte", "@sveltejs/*", "vite", "svelte-check"]
        update-types: ["minor", "patch"]
      svelte-major:
        patterns: ["svelte", "@sveltejs/*", "vite", "svelte-check"]
        update-types: ["major"]
      npm-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      cargo-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
