[package]
name = "coderabbit-steward"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
authors = ["Martin <martin@kleinbem.dev>"]
description = "Budget tracker, scheduler, coverage map, and findings steward for CodeRabbit OSS"
license = "MIT"
repository = "https://github.com/kleinbem-dev/coderabbit-steward"
readme = "README.md"
keywords = ["coderabbit", "github", "scheduler", "code-review"]
categories = ["development-tools", "command-line-utilities"]

[lib]
name = "coderabbit_steward"
path = "src/lib.rs"

[[bin]]
name = "cr-steward"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", features = ["json"] }
clap = { version = "4.5", features = ["derive", "env"] }
hex = "0.4.3"
hmac = "0.13.0"
jiff = { version = "0.2", default-features = false, features = ["std", "tzdb-bundle-always", "serde"] }
jsonwebtoken = "9.3"
regex = "1.11"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "sqlite", "macros", "migrate"] }
subtle = "2.6"
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
